name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 3 * * *" # nightly: fuzzing

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || {
            # Surface the failures as annotations, readable without the logs.
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

  lint:
    name: lint (hygiene, gofmt, staticcheck, govulncheck, goreleaser check)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - name: hygiene (no internal names in tracked files)
        run: sh scripts/hygiene.sh
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: goreleaser check
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

  # Real brokers in Docker. The harness in test/integration starts one
  # throwaway container per image (named lockmq-it-*, ports on 127.0.0.1),
  # seeds it through the management API and removes it when the test binary
  # exits; the images are pulled up front, in parallel.
  integration:
    name: integration (RabbitMQ 3.13, 4.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: pull images
        run: |
          docker pull --quiet rabbitmq:3.13-management &
          docker pull --quiet rabbitmq:4.1-management &
          wait
      - name: go test -tags integration
        run: go test -tags integration -count=1 -timeout 25m ./test/integration/

  # The image of docs/docker.md: both targets build, ALLOWED_UIDS is
  # checked, and test/docker/e2e.py follows the guide against a RabbitMQ
  # container (console in a pseudo-terminal, agent in throwaway containers,
  # peers outside the setup refused).
  docker:
    name: docker (build, vault target, end to end)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build --build-arg VERSION=ci -t lockmq .
      - name: docker build --target vault
        run: |
          docker build --target vault -t lockmq-vault .
          docker run --rm --entrypoint vault lockmq-vault version
      - name: ALLOWED_UIDS
        run: |
          docker build --build-arg ALLOWED_UIDS=4242,4243 -t lockmq-allowed .
          docker run --rm --entrypoint cat lockmq-allowed /etc/lockmq/system.toml | grep -x 'allowed_uids = \[4242,4243\]'
          if docker build --build-arg ALLOWED_UIDS='1,,2' . >/dev/null 2>&1; then echo "ALLOWED_UIDS=1,,2 accepted" >&2; exit 1; fi
      - name: docker build from the repository URL
        if: github.event_name == 'push'
        run: docker build -t lockmq-url "https://github.com/${{ github.repository }}.git#${{ github.sha }}"
      - name: pull rabbitmq
        run: docker pull --quiet rabbitmq:4.1-management
      - name: end to end
        run: python3 test/docker/e2e.py lockmq

  fuzz:
    name: fuzz (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: FuzzMaskNoPanic
        run: go test -run '^$' -fuzz '^FuzzMaskNoPanic$' -fuzztime 120s ./internal/msgmask/
