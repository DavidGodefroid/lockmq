name: pages

# The site in site/ is plain HTML and CSS: no build step. Pull requests check
# it (hygiene, links); a push to main checks it again, then deploys it to
# GitHub Pages (Settings → Pages → Source: GitHub Actions).
on:
  pull_request:
    paths:
      - "site/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "README.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check site/ (hygiene, links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: hygiene (no internal names in tracked files)
        run: sh scripts/hygiene.sh
      - name: no custom domain
        run: test ! -e site/CNAME
      # Relative links, assets and external links (releases, docs on GitHub).
      # 404.html uses absolute /lockmq/ paths, valid only once deployed; the
      # site's own URL is not live before the first deployment.
      - name: links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-retries 3
            --exclude-path site/404.html
            --exclude '^https://davidgodefroid\.github\.io/'
            --exclude '^https://token\.actions\.githubusercontent\.com'
            'site/**/*.html'
            README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: deploy site/ to GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # publish the Pages deployment
      id-token: write # authenticate the deployment (GitHub OIDC)
    # One deployment at a time; a newer push does not cancel one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
