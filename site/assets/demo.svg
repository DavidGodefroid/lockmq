red · no message removed</tspan></text><text x="564" y="337" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" xml:space="preserve"><tspan fill="#a78bfa">│ </tspan><tspan fill="#e2e8f0">PII: masked (1 mask rules, 0 allow rules; body detect; detectors: card, email)</tspan></text></g>
